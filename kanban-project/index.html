<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>kanban-project</title>
  </head>
  <body>
    <header>
      <h1>Mon Kanban</h1>

      <form class="add-form">
        <input
          type="text"
          id="new-card"
          aria-label="Nouvelle tâche"
          placeholder="Nouvelle tâche..."
        />
        <button type="submit" class="btn-primary">+ Ajouter</button>
      </form>
    </header>

    <main class="board">
      <article class="column column--todo">
        <div class="column__header">
          <div class="dot--header">
            <h2 class="todo-text">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-circle preview-icon"
              >
                <circle cx="12" cy="12" r="10" />
              </svg>
              À faire
            </h2>
          </div>

          <p class="column__count todo__count">0</p>
        </div>


        
      </article>

      <article class="column column--doing">
        <div class="column__header">
          <div class="dot--header">
            <h2 class="doing-text">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor" />
                <circle cx="12" cy="12" r="10" />
              </svg>
              En cours
            </h2>
          </div>

          <p class="column__count doing__count">0</p>
        </div>
      </article>

      <article class="column column--done">
        <div class="column__header">
          <div class="dot--header">
            <h2 class="done-text">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-circle-check-big preview-icon"
              >
                <path d="M21.801 10A10 10 0 1 1 17 3.335" />
                <path d="m9 11 3 3L22 4" />
              </svg>
              Terminé
            </h2>
          </div>

          <p class="column__count done__count">0</p>
        </div>
      </article>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
